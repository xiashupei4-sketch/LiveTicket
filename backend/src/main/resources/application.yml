server:
  port: 8080

spring:
  application:
    name: liveticket

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/liveticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:liveticket}
    password: ${MYSQL_PASSWORD:liveticket123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:liveticket}
    password: ${RABBITMQ_PASSWORD:liveticket123}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 3
        max-concurrency: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:LiveTicketDemoJwtSecretKeyMustBeLongerThan32Chars2026}
    expire-seconds: 86400
  admin-token: ${ADMIN_TOKEN:liveticket-admin-demo}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
